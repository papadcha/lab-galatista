name: Build Windows installer

# Χειροκίνητο trigger — καλείται από το tab Actions του GitHub repo
# ("Run workflow"), από οποιοδήποτε μηχάνημα (δεν χρειάζεται Windows
# μπροστά σου). master είναι το default branch, οπότε φαίνεται κανονικά
# στη λίστα workflows χωρίς επιπλέον ρύθμιση.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyinstaller reportlab Pillow charset-normalizer

      - name: Install npm dependencies
        run: npm install

      - name: Build (backend + smoke-test + installer)
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lab-Galatista-Setup
          path: dist-installer/*.exe
          if-no-files-found: error
